# Deploy the Vite SPA to Azure Static Web Apps.
# Prereq: create a Static Web App in Azure Portal, link this repo, and add the deployment token as
# repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (name shown in Azure's generated workflow).

name: Deploy frontend (Azure Static Web Apps)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "dist"
          app_install_command: "npm ci"
          app_build_command: "npm run build"
        env:
          VITE_AZURE_API_BASE_URL: https://Sanku-GR.azurewebsites.net/api
