# Deploy the Vite SPA to Azure Static Web Apps.
# Prereq: create a Static Web App in Azure Portal, link this repo, and add the deployment token as
# repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (name shown in Azure's generated workflow).

name: Deploy frontend (Azure Static Web Apps)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: dist
          app_install_command: npm ci
          app_build_command: npm run build
